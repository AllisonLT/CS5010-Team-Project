name: Starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Java modules and run JUnit 5
        run: bash ./mvnw --batch-mode verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - name: Install ML service and test dependencies
        run: python -m pip install -e "./services/ml[dev]"
      - name: Run pytest
        run: python -m pytest services/ml/tests
