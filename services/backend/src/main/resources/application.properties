spring.application.name=cold-storage-backend
server.address=127.0.0.1
server.port=${BACKEND_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/cold_storage?serverSelectionTimeoutMS=3000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=true
app.ml.base-url=${ML_BASE_URL:http://127.0.0.1:8000}
app.ml.connect-timeout=1s
app.ml.read-timeout=4s
app.storage.upload-directory=${UPLOAD_DIRECTORY:./data/uploads}
app.storage.max-upload-bytes=52428800
# Slightly above the 50 MB file limit so the backend, not the servlet container, reports the error.
spring.servlet.multipart.max-file-size=51MB
spring.servlet.multipart.max-request-size=52MB
